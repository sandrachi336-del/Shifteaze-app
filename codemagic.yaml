workflows:
  ios-release:
    name: iOS Release
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: Codemagic
    environment:
      node: 20
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier:co.median.ios.nmnaldr
      vars:
        APP_NAME: Shifteaze
        BUNDLE_ID: co.median.ios.nmnaldr
        APP_STORE_APPLE_ID: 6443553978
    scripts:
      - name: Check icon exists
        script: |
          test -f assets/icon.png || (echo "Add assets/icon.png (1024x1024)" && exit 1)
      - name: Install dependencies
        script: |
          npm install
          npm install @capacitor/core@7 @capacitor/cli@7 @capacitor/ios@7 @capacitor/assets
      - name: Build web app
        script: npm run build
      - name: Create iPhone project
        script: |
          npx cap init "$APP_NAME" "$BUNDLE_ID" --web-dir dist
          npx cap add ios
          npx cap sync ios
      - name: Generate app icons
        script: npx capacitor-assets generate --ios
      - name: Set version and skip encryption prompt
        script: |
          cd $CM_BUILD_DIR/ios/App
          LATEST=$(app-store-connect get-latest-app-store-build-number "$APP_STORE_APPLE_ID")
          NEW=$((LATEST + 1))
          sed -i '' "s/CURRENT_PROJECT_VERSION = [0-9]*;/CURRENT_PROJECT_VERSION = $NEW;/g" App.xcodeproj/project.pbxproj
          sed -i '' "s/MARKETING_VERSION = [0-9.]*;/MARKETING_VERSION = 1.0;/g" App.xcodeproj/project.pbxproj
          /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" App/Info.plist || true
      - name: Set up code signing
        script: xcode-project use-profiles
      - name: Build IPA
        script: |
          xcode-project build-ipa \
            --workspace "$CM_BUILD_DIR/ios/App/App.xcworkspace" \
            --scheme "App"
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: false
